<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Fun Facts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fact-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-left: 5px solid #667eea;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 10px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fact-text {
            font-size: 1.3em;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-next:active {
            transform: translateY(0);
        }

        .btn-random {
            background: #f39c12;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-random:hover {
            background: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(243, 156, 18, 0.4);
        }

        .btn-random:active {
            transform: translateY(0);
        }

        .counter {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .emoji {
            font-size: 2em;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .fact-text {
                font-size: 1.1em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Fun Facts</h1>
        <div class="emoji" id="emoji">🎓</div>
        <div class="fact-box">
            <p class="fact-text" id="fact">Click "Next Fact" to discover something amazing!</p>
        </div>
        <div class="button-group">
            <button class="btn-next" onclick="nextFact()">Next Fact →</button>
            <button class="btn-random" onclick="randomFact()">🎲 Random</button>
        </div>
        <div class="counter">
            <p>Fact <span id="current">0</span> of <span id="total">0</span></p>
        </div>
    </div>

    <script>
        const facts = [
            { text: "Honey never spoils. Archaeologists have found 3,000-year-old honey in Egyptian tombs that was still edible!", emoji: "🍯" },
            { text: "A group of flamingos is called a 'flamboyance'.", emoji: "🦩" },
            { text: "Octopuses have three hearts and blue blood!", emoji: "🐙" },
            { text: "Bananas are berries, but strawberries aren't technically berries.", emoji: "🍌" },
            { text: "A day on Venus is longer than its year.", emoji: "♀️" },
            { text: "Sloths only defecate once a week.", emoji: "🦥" },
            { text: "The Eiffel Tower can be 15 cm taller during summer due to thermal expansion.", emoji: "🗼" },
            { text: "Wombats produce cube-shaped poop!", emoji: "🦘" },
            { text: "A group of crows is called a 'murder'.", emoji: "🐦" },
            { text: "Dolphins have names for each other and can call one another by name.", emoji: "🐬" },
            { text: "The Great Wall of China is visible from space with the naked eye. (This is actually a myth!)", emoji: "🧱" },
            { text: "Penguins have knees! They're just hidden under their feathers.", emoji: "🐧" },
            { text: "A shark is the only fish that can blink with both eyes.", emoji: "🦈" },
            { text: "Cleopatra lived closer to the moon landing than to the building of the Great Pyramid.", emoji: "👑" },
            { text: "Carrots were originally purple, not orange.", emoji: "🥕" },
            { text: "Cats have a special collarbone that allows them to squeeze through tight spaces.", emoji: "🐱" },
            { text: "Scotland's national animal is a unicorn.", emoji: "🦄" },
            { text: "A cockroach can live for a week without its head.", emoji: "🪳" },
            { text: "Honey bees can recognize human faces.", emoji: "🐝" },
            { text: "The fingerprints of koalas are so similar to humans that they could confuse crime scene investigators.", emoji: "🐨" }
        ];

        let currentIndex = 0;

        function displayFact(index) {
            const fact = facts[index];
            document.getElementById('fact').textContent = fact.text;
            document.getElementById('emoji').textContent = fact.emoji;
            document.getElementById('current').textContent = index + 1;
            document.getElementById('total').textContent = facts.length;
        }

        function nextFact() {
            currentIndex = (currentIndex + 1) % facts.length;
            displayFact(currentIndex);
        }

        function randomFact() {
            currentIndex = Math.floor(Math.random() * facts.length);
            displayFact(currentIndex);
        }

        // Display first fact on load
        window.addEventListener('load', () => {
            displayFact(currentIndex);
        });
    </script>
</body>
</html>
